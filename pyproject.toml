[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Automated, fee-aware trading bot for Kalshi short-duration gold markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "cryptography>=43",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.5", "scipy>=1.13"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
